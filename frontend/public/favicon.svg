<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="stylioGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e2b3" />
      <stop offset="35%" stop-color="#c5a059" />
      <stop offset="70%" stop-color="#e8cf8d" />
      <stop offset="100%" stop-color="#8f6e2b" />
    </linearGradient>
    <linearGradient id="stylioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="100" height="100" rx="22" fill="url(#stylioBg)"/>
  <rect width="98" height="98" x="1" y="1" rx="21" stroke="url(#stylioGold)" stroke-width="0.8" opacity="0.3"/>

  <!-- Geometric Diamond Outer Contour -->
  <polygon points="26,18 74,18 92,36 50,90 8,36" 
           stroke="url(#stylioGold)" stroke-width="2.6" stroke-linejoin="round" fill="none"/>
  
  <!-- Crown Facets -->
  <line x1="40" y1="18" x2="28" y2="36" stroke="url(#stylioGold)" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="60" y1="18" x2="72" y2="36" stroke="url(#stylioGold)" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="26" y1="18" x2="50" y2="36" stroke="url(#stylioGold)" stroke-width="1.3" opacity="0.75"/>
  <line x1="74" y1="18" x2="50" y2="36" stroke="url(#stylioGold)" stroke-width="1.3" opacity="0.75"/>

  <!-- Waist Horizontal Grid -->
  <line x1="8" y1="36" x2="92" y2="36" stroke="url(#stylioGold)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Pavilion Facets -->
  <line x1="28" y1="36" x2="50" y2="90" stroke="url(#stylioGold)" stroke-width="1.4" opacity="0.8"/>
  <line x1="72" y1="36" x2="50" y2="90" stroke="url(#stylioGold)" stroke-width="1.4" opacity="0.8"/>

  <!-- Geometric Haute Couture 'S' Monogram -->
  <path d="M64,28 
           C58,24 43,24 38,30 
           C33,36 36,44 48,47 
           C62,51 66,58 63,67 
           C59,76 43,76 35,71 
           M33,70 L38,65
           M66,29 L61,34" 
        stroke="url(#stylioGold)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Central Diamond Sparkle -->
  <polygon points="50,44 52,48 56,50 52,52 50,56 48,52 44,50 48,48" fill="url(#stylioGold)"/>
</svg>